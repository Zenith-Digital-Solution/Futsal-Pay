x-backend-env: &backend-env
  PYTHONPATH: .
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-secret}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-futsal}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-10}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://144.126.252.228:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://144.126.252.228:3000}
  SERVER_HOST: ${SERVER_HOST:-http://144.126.252.228:8000}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-False}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Futsal Pay}
  MAILGUN_ENABLED: ${MAILGUN_ENABLED:-False}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
  PAYOUT_MODE: ${PAYOUT_MODE:-PLATFORM}
  PLATFORM_FEE_PCT: ${PLATFORM_FEE_PCT:-5.0}
  PLATFORM_KHALTI_SECRET_KEY: ${PLATFORM_KHALTI_SECRET_KEY:-}
  PLATFORM_KHALTI_MOBILE: ${PLATFORM_KHALTI_MOBILE:-}
  PLATFORM_ESEWA_MERCHANT_CODE: ${PLATFORM_ESEWA_MERCHANT_CODE:-}
  PLATFORM_ESEWA_SECRET_KEY: ${PLATFORM_ESEWA_SECRET_KEY:-}
  PLATFORM_BANK_NAME: ${PLATFORM_BANK_NAME:-}
  PLATFORM_BANK_ACCOUNT_NUMBER: ${PLATFORM_BANK_ACCOUNT_NUMBER:-}
  PLATFORM_BANK_ACCOUNT_NAME: ${PLATFORM_BANK_ACCOUNT_NAME:-}
  PLATFORM_BANK_SWIFT_CODE: ${PLATFORM_BANK_SWIFT_CODE:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-futsal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-futsal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_media:/app/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A src.apps.core.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A src.apps.core.celery_app beat --loglevel=info
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://144.126.252.228:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://144.126.252.228:8000}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
        NEXT_PUBLIC_GITHUB_ENABLED: ${NEXT_PUBLIC_GITHUB_ENABLED:-false}
        NEXT_PUBLIC_FACEBOOK_ENABLED: ${NEXT_PUBLIC_FACEBOOK_ENABLED:-false}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://144.126.252.228:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://144.126.252.228:8000}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
      NEXT_PUBLIC_GITHUB_ENABLED: ${NEXT_PUBLIC_GITHUB_ENABLED:-false}
      NEXT_PUBLIC_FACEBOOK_ENABLED: ${NEXT_PUBLIC_FACEBOOK_ENABLED:-false}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@futsal.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  backend_media:
  pgadmin_data:
